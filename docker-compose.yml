version: "3.8"
services:
  postgres:
    image: "postgres:latest"
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: berkut-db
      POSTGRES_USER: berkut
      POSTGRES_PASSWORD: berkut
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: